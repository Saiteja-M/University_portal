components:
  schemas:
    AcademicYear:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 20
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - name
      - start_date
      - updated_at
    AcademicYearRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 20
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
      required:
      - end_date
      - name
      - start_date
    BlankEnum:
      enum:
      - ''
    BloodGroupEnum:
      enum:
      - A+
      - A-
      - B+
      - B-
      - AB+
      - AB-
      - O+
      - O-
      type: string
      description: |-
        * `A+` - A+
        * `A-` - A-
        * `B+` - B+
        * `B-` - B-
        * `AB+` - AB+
        * `AB-` - AB-
        * `O+` - O+
        * `O-` - O-
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        semester:
          type: integer
        semester_number:
          type: integer
          readOnly: true
        program_name:
          type: string
          readOnly: true
        regulation:
          type: integer
        regulation_code:
          type: string
          readOnly: true
        code:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 200
        credits:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - program_name
      - regulation
      - regulation_code
      - semester
      - semester_number
      - updated_at
    CourseRequest:
