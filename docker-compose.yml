services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================

  postgres:
    image: postgres:16-alpine
    container_name: university-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: university_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d university_portal"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==========================================================
  # Redis
  # ==========================================================

  redis:
    image: redis:7-alpine
    container_name: university-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


# ============================================================
# Persistent Volumes
# ============================================================

volumes:
  postgres_data:
  redis_data: